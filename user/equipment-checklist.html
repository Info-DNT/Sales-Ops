<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Checklist - Sales Ops</title>
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/crm-styles.css">
    <style>
        .eq-readonly-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; }
        .eq-field-label { font-size: 0.78rem; color: #64748b; margin-bottom: 2px; }
        .eq-field-value { font-weight: 600; }
        .eq-field-value.eq-yes { color: #059669; }
        .eq-field-value.eq-no { color: #94a3b8; }
    </style>
</head>
<body>
    <div id="app">
        <div class="main-content">
            <div class="page-header flex-wrap gap-3">
                <div>
                    <h2 class="mb-0">Equipment Checklist</h2>
                    <p class="text-muted small mb-0">Equipment preparation, issue & return tracking</p>
                </div>
            </div>

            <div class="content-card mb-3">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="search-ec-query" placeholder="Search patient name, Ref ID, route..." oninput="filterEC()">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="filter-ec-status" onchange="filterEC()">
                            <option value="">All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="Issued">Issued</option>
                            <option value="In Transit">In Transit</option>
                            <option value="Returned">Returned</option>
                            <option value="Partially Returned">Partially Returned</option>
                            <option value="Damaged">Damaged</option>
                            <option value="Lost">Lost</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <div id="ec-list-container">
                    <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Equipment Checklist Modal -->
    <div class="modal fade" id="editECModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-clipboard-check me-2 text-primary"></i>Equipment Checklist</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-ec-form">
                        <input type="hidden" id="ec-id">

                        <h6 class="border-bottom pb-2 mb-3 text-primary"><i class="fas fa-lungs me-2"></i>Equipment Requirements <span class="text-muted small fw-normal">(from Quotation Control — reference only)</span></h6>
                        <div class="eq-readonly-card mb-4">
                            <div class="row g-3" id="ec-readonly-fields"></div>
                        </div>

                        <h6 class="border-bottom pb-2 mb-3 text-primary"><i class="fas fa-truck-loading me-2"></i>Issue & Return Tracking</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-600">Equipment Status *</label>
                                <select class="form-select" id="ec-status" required>
                                    <option value="Pending">Pending</option>
                                    <option value="Issued">Issued</option>
                                    <option value="In Transit">In Transit</option>
                                    <option value="Returned">Returned</option>
                                    <option value="Partially Returned">Partially Returned</option>
                                    <option value="Damaged">Damaged</option>
                                    <option value="Lost">Lost</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Equipment Issue Date</label>
                                <input type="date" class="form-control" id="ec-issue-date">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Expected Return Date</label>
                                <input type="date" class="form-control" id="ec-return-date">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Issued By</label>
                                <input type="text" class="form-control" id="ec-issued-by" placeholder="Name of issuing staff">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Received By</label>
                                <input type="text" class="form-control" id="ec-received-by" placeholder="Name of receiving staff">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Notes</label>
                                <textarea class="form-control" id="ec-notes" rows="3" placeholder="Condition notes, missing items, remarks..."></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="save-ec-btn">Save Equipment Checklist</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/common.js"></script>
    <script>
        let myECs = [];
        let session = null;

        // Grouped for readable display — mirrors EQUIPMENT_FIELD_LABELS in
        // supabase-client.js plus the 3 free-text fields not in the gate.
        const EC_DISPLAY_GROUPS = [
            {
                title: 'Oxygen', icon: 'fa-wind', fields: [
                    ['oxygen_requirement', 'Oxygen Requirement'],
                    ['oxygen_flow_rate', 'Oxygen Flow Rate'],
                    ['oxygen_concentrator_requirement', 'Oxygen Concentrator'],
                    ['oxygen_meter_requirement', 'Oxygen Meter']
                ]
            },
            {
                title: 'Ventilation', icon: 'fa-lungs', fields: [
                    ['ventilator_requirement', 'Ventilator Requirement'],
                    ['ventilator_mode', 'Ventilator Mode']
                ]
            },
            {
                title: 'Monitoring', icon: 'fa-heartbeat', fields: [
                    ['cardiac_monitor_required', 'Cardiac Monitor'],
                    ['electronic_bp_monitor', 'Electronic BP Monitor'],
                    ['glucometer_requirement', 'Glucometer'],
                    ['thermometer_requirement', 'Thermometer']
                ]
            },
            {
                title: 'Other Equipment', icon: 'fa-kit-medical', fields: [
                    ['infusion_pump_required', 'Infusion Pump'],
                    ['aed_machine_requirement', 'AED Machine'],
                    ['automatic_external_defibrillator', 'Automatic External Defibrillator'],
                    ['syringe_pump_requirement', 'Syringe Pump'],
                    ['fetal_doppler_requirement', 'Fetal Doppler'],
                    ['mesh_nebulizer_requirement', 'Mesh Nebulizer'],
                    ['laryngoscope_set', 'Laryngoscope Set'],
                    ['suction_required', 'Suction'],
                    ['special_medication_required', 'Special Medication']
                ]
            }
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!initAuthCheck('user')) return;
            session = getCurrentSession();
            insertNav('user', 'equipment-checklist');
            await loadECs();
            generateBottomNav('equipment-checklist');
            generateLeadsSubTabs('equipment-checklist', '../user/');
        });

        async function loadECs() {
            try {
                myECs = await getEquipmentChecklists(session.userId);
                renderECs(myECs);
            } catch (err) {
                console.error('Error loading Equipment Checklists:', err);
                showToast('Failed to load Equipment Checklist records', 'error');
            }
        }

        function filterEC() {
            const query = (document.getElementById('search-ec-query').value || '').toLowerCase();
            const status = document.getElementById('filter-ec-status').value;

            const filtered = myECs.filter(e => {
                const matchQuery = !query ||
                    (e.patient_name || '').toLowerCase().includes(query) ||
                    (e.master_reference_id || '').toLowerCase().includes(query) ||
                    (e.record_name || '').toLowerCase().includes(query) ||
                    (e.route || '').toLowerCase().includes(query);
                const matchStatus = !status || e.equipment_status === status;
                return matchQuery && matchStatus;
            });
            renderECs(filtered);
        }

        function ecStatusClass(status) {
            return {
                'Pending': 'bg-secondary text-white',
                'Issued': 'bg-primary text-white',
                'In Transit': 'bg-info text-white',
                'Returned': 'bg-success text-white',
                'Partially Returned': 'bg-warning text-dark',
                'Damaged': 'bg-danger text-white',
                'Lost': 'bg-danger text-white'
            }[status] || 'bg-secondary text-white';
        }

        function renderECs(list) {
            const container = document.getElementById('ec-list-container');
            if (!list || list.length === 0) {
                container.innerHTML = `<div class="text-center py-5 text-muted"><i class="fas fa-clipboard-check fa-3x mb-3 opacity-50"></i><p>No Equipment Checklist records found.</p></div>`;
                return;
            }

            container.innerHTML = list.map(e => {
                return `
                <div class="content-card mb-3 border-start border-4 border-indigo">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
                        <div>
                            <span class="badge bg-indigo-subtle text-indigo me-2 font-monospace fw-bold">${e.master_reference_id || 'AM-REF-N/A'}</span>
                            <span class="badge ${ecStatusClass(e.equipment_status)}">${e.equipment_status || 'Pending'}</span>
                            <h5 class="mt-2 mb-1">${e.record_name || e.patient_name || 'Equipment Checklist Record'}</h5>
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            ${canPerform('equipment_checklist', 'edit') ? `
                            <button class="btn btn-sm btn-outline-primary" onclick="openEditECModal('${e.id}')">
                                <i class="fas fa-edit me-1"></i> Update Tracking
                            </button>` : ''}
                        </div>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-md-3"><small class="text-muted d-block">Patient</small><strong>${e.patient_name || '—'}</strong></div>
                        <div class="col-md-3"><small class="text-muted d-block">Route</small><span>${e.route || 'TBD'}</span></div>
                        <div class="col-md-3"><small class="text-muted d-block">Issue Date</small><span>${e.equipment_issue_date || '—'}</span></div>
                        <div class="col-md-3"><small class="text-muted d-block">Expected Return</small><span>${e.expected_return_date || '—'}</span></div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderReadonlyFields(ec) {
            const container = document.getElementById('ec-readonly-fields');
            container.innerHTML = EC_DISPLAY_GROUPS.map(group => `
                <div class="col-md-6">
                    <div class="mb-2"><i class="fas ${group.icon} me-1 text-muted"></i><strong class="small">${group.title}</strong></div>
                    <div class="row g-2">
                        ${group.fields.map(([key, label]) => {
                            const val = ec[key];
                            const display = val || '—';
                            const cls = val === 'Yes' ? 'eq-yes' : (val === 'No' ? 'eq-no' : '');
                            return `
                            <div class="col-6">
                                <div class="eq-field-label">${label}</div>
                                <div class="eq-field-value ${cls}">${display}</div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function openEditECModal(id) {
            try {
                const e = await getEquipmentChecklistById(id);
                document.getElementById('ec-id').value = e.id;
                document.getElementById('ec-status').value = e.equipment_status || 'Pending';
                document.getElementById('ec-issue-date').value = e.equipment_issue_date || '';
                document.getElementById('ec-return-date').value = e.expected_return_date || '';
                document.getElementById('ec-issued-by').value = e.issued_by || '';
                document.getElementById('ec-received-by').value = e.received_by || '';
                document.getElementById('ec-notes').value = e.notes || '';

                renderReadonlyFields(e);

                const modal = new bootstrap.Modal(document.getElementById('editECModal'));
                modal.show();
            } catch (err) {
                console.error(err);
                showToast('Failed to load equipment checklist details', 'error');
            }
        }

        document.getElementById('edit-ec-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('ec-id').value;

            // Never write an empty string into a date column — omit the key instead.
            const updates = {
                equipment_status: document.getElementById('ec-status').value,
                issued_by: document.getElementById('ec-issued-by').value,
                received_by: document.getElementById('ec-received-by').value,
                notes: document.getElementById('ec-notes').value
            };
            const issueDate = document.getElementById('ec-issue-date').value;
            const returnDate = document.getElementById('ec-return-date').value;
            if (issueDate) updates.equipment_issue_date = issueDate;
            if (returnDate) updates.expected_return_date = returnDate;

            try {
                await updateEquipmentChecklist(id, updates);
                showToast('Equipment Checklist updated successfully!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('editECModal')).hide();
                await loadECs();
            } catch (err) {
                console.error(err);
                showToast(err.message || 'Failed to update equipment checklist', 'error');
            }
        });
    </script>
</body>
</html>
