<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Sales Ops</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            position: relative;
            overflow-x: hidden;
        }

        .signup-container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }

        .signup-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
        }

        .form-label {
            font-weight: 500;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            font-weight: 600;
            background: #6366f1;
            border: none;
            color: white;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
        }

        .btn-submit:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .success-state {
            display: none;
            text-align: center;
            padding: 2rem 0;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #dcfce7;
            color: #16a34a;
            font-size: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .back-to-login {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back-to-login:hover {
            color: #6366f1;
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <div class="signup-card">
            <div id="form-state">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="Air Medical 24x7">
                    <h4 class="mt-3" style="color: #1e293b; font-weight: 700;">Sign up</h4>
                    <p class="text-muted small">Enter your details to request login credentials</p>
                </div>

                <form id="signup-form">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="+91 00000 00000" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="designation" class="form-label">Designation</label>
                        <input type="text" class="form-control" id="designation" placeholder="e.g. Sales Executive" required>
                    </div>

                    <button type="submit" class="btn btn-submit" id="submit-btn">
                        <span id="btn-text">Share Details with Admin</span>
                        <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>

                <a href="index.html" class="back-to-login">
                    <i class="fas fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>

            <div id="success-state" class="success-state">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <h4 style="color: #1e293b; font-weight: 700;">Request Shared!</h4>
                <p class="text-muted mt-3" style="font-size: 1.1rem; line-height: 1.6;">
                    Your detail has been shared with the admin you will receive your credentials soon on your email.
                </p>
                <a href="index.html" class="btn btn-outline-primary mt-4 w-100 py-2">
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = btn.querySelector('.spinner-border');

            // Set loading state
            btn.disabled = true;
            btnText.textContent = 'Sharing...';
            spinner.classList.remove('d-none');

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                designation: document.getElementById('designation').value
            };

            try {
                const response = await fetch('/.netlify/functions/notify-signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('form-state').style.display = 'none';
                    document.getElementById('success-state').style.display = 'block';
                } else {
                    const error = await response.json();
                    alert('Submission failed: ' + (error.error || 'Unknown error'));
                    btn.disabled = false;
                    btnText.textContent = 'Share Details with Admin';
                    spinner.classList.add('d-none');
                }
            } catch (error) {
                console.error('Signup error:', error);
                alert('Network error. Please try again.');
                btn.disabled = false;
                btnText.textContent = 'Share Details with Admin';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>

</html>
